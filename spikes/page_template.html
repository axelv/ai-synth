<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ground: #e9eef0; --surface: #ffffff; --sunk: #dde5e7; --line: #c3d0d3;
    --ink: #11191b; --muted: #5b6c70; --accent: #0d6f78; --live: #17724f;
    --key-white: #fbfdfd; --key-white-on: #7fd0d6; --key-black: #1d2a2d; --key-black-on: #0d6f78;
    --shadow: 0 1px 2px rgba(17,25,27,.06), 0 6px 20px rgba(17,25,27,.05);
    --sans: "Archivo", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c1113; --surface: #151e21; --sunk: #101819; --line: #2a393d;
      --ink: #e4edee; --muted: #8ea3a7; --accent: #45b9c1; --live: #4cc190;
      --key-white: #c8d6d8; --key-white-on: #45b9c1; --key-black: #0a1113; --key-black-on: #1f7c84;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c1113; --surface: #151e21; --sunk: #101819; --line: #2a393d;
    --ink: #e4edee; --muted: #8ea3a7; --accent: #45b9c1; --live: #4cc190;
    --key-white: #c8d6d8; --key-white-on: #45b9c1; --key-black: #0a1113; --key-black-on: #1f7c84;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 54rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem;
    display: flex; flex-direction: column; gap: 1.75rem;
  }
  .eyebrow {
    font-family: var(--mono); font-size: .7rem; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 .5rem;
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 700;
    letter-spacing: -.02em; line-height: 1.1; margin: 0 0 .6rem; text-wrap: balance;
  }
  .standfirst { margin: 0; color: var(--muted); max-width: 42rem; }

  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.25rem;
    border: 1px solid var(--line); border-radius: 3px; background: var(--surface);
    box-shadow: var(--shadow); padding: .9rem 1.1rem;
  }
  button {
    font-family: var(--sans); font-size: .95rem; font-weight: 500;
    color: var(--surface); background: var(--accent);
    border: 1px solid var(--accent); border-radius: 3px;
    padding: .55rem 1.1rem; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; filter: none; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
  .status b { color: var(--live); font-weight: 600; }

  /* ---- keyboard ---- */
  .keys {
    position: relative; height: 10rem; user-select: none; touch-action: none;
    border: 1px solid var(--line); border-radius: 3px; background: var(--sunk);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .key { position: absolute; top: 0; cursor: pointer; }
  .key.white {
    background: var(--key-white); border-right: 1px solid var(--line);
    height: 100%; border-radius: 0 0 2px 2px;
  }
  .key.white.on { background: var(--key-white-on); }
  .key.black {
    background: var(--key-black); height: 62%; z-index: 2; border-radius: 0 0 2px 2px;
  }
  .key.black.on { background: var(--key-black-on); }
  .key .lbl {
    position: absolute; bottom: .35rem; left: 0; right: 0; text-align: center;
    font-family: var(--mono); font-size: .6rem; color: var(--muted); pointer-events: none;
  }
  .key.black .lbl { color: #8ea3a7; bottom: .25rem; }

  /* ---- macros ---- */
  .macros {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
    gap: 1rem 1.5rem;
    border: 1px solid var(--line); border-radius: 3px; background: var(--surface);
    box-shadow: var(--shadow); padding: 1.1rem 1.25rem;
  }
  .macro { display: flex; flex-direction: column; gap: .3rem; }
  .macro .row { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
  .macro label {
    font-size: .85rem; font-weight: 500; letter-spacing: .01em;
  }
  .macro .val {
    font-family: var(--mono); font-size: .75rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  h2 {
    font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em;
    margin: 0 0 .1rem;
  }
  .section { display: flex; flex-direction: column; gap: .7rem; }
  .note { font-size: .85rem; color: var(--muted); margin: 0; }
  kbd {
    font-family: var(--mono); font-size: .78rem; background: var(--sunk);
    border: 1px solid var(--line); border-radius: 2px; padding: .05rem .3rem;
  }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">__EYEBROW__</p>
    <h1>__TITLE__</h1>
    <p class="standfirst">__BLURB__</p>
  </header>

  <div class="bar">
    <button id="start">Start audio</button>
    <span class="status" id="status">Not started</span>
    <span class="status" id="midi">MIDI: checking</span>
  </div>

  <div class="section">
    <h2>Keyboard</h2>
    <div class="keys" id="keys"></div>
    <p class="note">
      Click the keys, or play the computer keyboard: <kbd>z</kbd> <kbd>s</kbd> <kbd>x</kbd> <kbd>d</kbd> <kbd>c</kbd>&hellip;
      for the lower octave, <kbd>q</kbd> <kbd>2</kbd> <kbd>w</kbd> <kbd>3</kbd> <kbd>e</kbd>&hellip; for the upper.
      <kbd>&larr;</kbd> and <kbd>&rarr;</kbd> shift octave.
    </p>
  </div>

  <div class="section">
    <h2>Macros</h2>
    <div class="macros" id="macros"></div>
  </div>
</div>

<script type="module">
// ============ Faust runtime (@grame/faustwasm standalone bundle, inlined) ============
__FAUSTWASM__
// ============ end runtime ============

const PAYLOAD = __PAYLOAD__;
const VOICES = __VOICES__;

const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

const $ = (id) => document.getElementById(id);
const setStatus = (t, live) => { $("status").innerHTML = live ? `<b>${t}</b>` : t; };

let node = null;
let ctx = null;
const held = new Set();

// ---- keyboard geometry ----
const LOW = 48, HIGH = 84;               // C3 to C6
const BLACK = new Set([1, 3, 6, 8, 10]);
const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const keyEls = new Map();
let octave = 0;

function buildKeys() {
  const host = $("keys");
  const whites = [];
  for (let n = LOW; n <= HIGH; n++) if (!BLACK.has(n % 12)) whites.push(n);
  const w = 100 / whites.length;

  const mk = (n, left, width, black) => {
    const d = document.createElement("div");
    d.className = "key " + (black ? "black" : "white");
    d.style.left = left + "%";
    d.style.width = width + "%";
    if (!black && n % 12 === 0) {
      const l = document.createElement("span");
      l.className = "lbl";
      l.textContent = "C" + (Math.floor(n / 12) - 1);
      d.appendChild(l);
    }
    d.dataset.note = String(n);
    host.appendChild(d);
    keyEls.set(n, d);
  };

  let wi = 0;
  for (let n = LOW; n <= HIGH; n++) {
    if (BLACK.has(n % 12)) continue;
    mk(n, wi * w, w, false);
    wi++;
  }
  wi = 0;
  for (let n = LOW; n <= HIGH; n++) {
    if (BLACK.has(n % 12)) continue;
    if (BLACK.has((n + 1) % 12) && n + 1 <= HIGH) {
      mk(n + 1, (wi + 1) * w - w * 0.29, w * 0.58, true);
    }
    wi++;
  }

  host.addEventListener("pointerdown", (e) => {
    const n = e.target.dataset && e.target.dataset.note;
    if (!n) return;
    host.setPointerCapture(e.pointerId);
    noteOn(+n, 100);
  });
  const release = () => { held.forEach(n => noteOff(n)); };
  host.addEventListener("pointerup", release);
  host.addEventListener("pointercancel", release);
  window.addEventListener("blur", release);
}

function paint(n, on) {
  const el = keyEls.get(n);
  if (el) el.classList.toggle("on", on);
}

function noteOn(n, vel) {
  if (!node || held.has(n)) return;
  held.add(n);
  node.keyOn(0, n, vel);
  paint(n, true);
}
function noteOff(n) {
  if (!node || !held.has(n)) return;
  held.delete(n);
  node.keyOff(0, n, 0);
  paint(n, false);
}

// ---- computer keyboard ----
const KEYMAP = {
  z:0, s:1, x:2, d:3, c:4, v:5, g:6, b:7, h:8, n:9, j:10, m:11,
  q:12, 2:13, w:14, 3:15, e:16, r:17, 5:18, t:19, 6:20, y:21, 7:22, u:23,
};
addEventListener("keydown", (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowLeft")  { octave = Math.max(-2, octave - 1); return; }
  if (e.key === "ArrowRight") { octave = Math.min(2, octave + 1); return; }
  const off = KEYMAP[e.key.toLowerCase()];
  if (off === undefined) return;
  e.preventDefault();
  noteOn(60 + off + octave * 12, 100);
});
addEventListener("keyup", (e) => {
  const off = KEYMAP[e.key.toLowerCase()];
  if (off === undefined) return;
  noteOff(60 + off + octave * 12);
});

// ---- macros ----
function buildMacros() {
  const host = $("macros");
  host.innerHTML = "";
  const items = [];
  const walk = (ui) => ui.forEach(it => {
    if (it.items) walk(it.items);
    else if (["hslider","vslider","nentry"].includes(it.type)) items.push(it);
  });
  walk(node.getUI());

  const skip = new Set(["freq", "gain", "gate"]);
  items.filter(it => !skip.has(it.label)).forEach(it => {
    const min = +it.min, max = +it.max, init = +it.init;
    const step = +it.step || (max - min) / 200;
    const d = document.createElement("div");
    d.className = "macro";
    d.innerHTML = '<div class="row"><label></label><span class="val"></span></div>' +
                  '<input type="range">';
    const lab = d.querySelector("label");
    const val = d.querySelector(".val");
    const inp = d.querySelector("input");
    lab.textContent = it.label;
    const id = "m-" + it.label.replace(/\W/g, "");
    lab.htmlFor = id; inp.id = id;
    inp.min = min; inp.max = max; inp.step = step; inp.value = init;
    const show = (v) => { val.textContent = (+v).toFixed(Math.abs(max - min) > 20 ? 0 : 3); };
    show(init);
    inp.addEventListener("input", () => {
      node.setParamValue(it.address, +inp.value);
      show(inp.value);
    });
    host.appendChild(d);
  });
}

// ---- MIDI, absent inside the artifact sandbox by permissions policy ----
async function initMidi() {
  const el = $("midi");
  if (typeof navigator.requestMIDIAccess !== "function") {
    el.textContent = "MIDI: unavailable in this browser";
    return;
  }
  try {
    const access = await navigator.requestMIDIAccess({ sysex: false });
    const attach = () => {
      const names = [];
      access.inputs.forEach(i => { names.push(i.name); i.onmidimessage = onMidi; });
      el.innerHTML = names.length
        ? `MIDI: <b>${names.join(", ")}</b>`
        : "MIDI: no device connected";
    };
    access.onstatechange = attach;
    attach();
  } catch (err) {
    el.textContent = err.name === "SecurityError"
      ? "MIDI: blocked by permissions policy, serve this page locally to use a keyboard"
      : "MIDI: " + err.name;
  }
}
function onMidi(ev) {
  const d = ev.data, s = d[0] & 0xf0;
  if (s === 0x90 && d[2] > 0) noteOn(d[1], d[2]);
  else if (s === 0x80 || (s === 0x90 && d[2] === 0)) noteOff(d[1]);
  else if (node) node.midiMessage(d);
}

// ---- boot ----
buildKeys();

$("start").addEventListener("click", async () => {
  const btn = $("start");
  btn.disabled = true;
  setStatus("starting");
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();

    const dspModule = await WebAssembly.compile(b64(PAYLOAD.dsp));
    const mixerModule = await WebAssembly.compile(b64(PAYLOAD.mixer));
    const effectModule = PAYLOAD.effect ? await WebAssembly.compile(b64(PAYLOAD.effect)) : null;

    const gen = new FaustPolyDspGenerator();
    node = await gen.createNode(
      ctx, VOICES, PAYLOAD.name,
      { module: dspModule, json: PAYLOAD.dspMeta, soundfiles: {} },
      mixerModule,
      effectModule ? { module: effectModule, json: PAYLOAD.effectMeta, soundfiles: {} } : undefined,
      false, 512
    );
    if (!node) throw new Error("createNode returned null");
    node.connect(ctx.destination);

    buildMacros();
    // Scripting handle: lets a test drive the instrument and tap its output without
    // clicking, which is the only way to verify this page from an automated browser.
    window.synth = { ctx, node, noteOn, noteOff };
    setStatus(`running, ${VOICES} voices, ${ctx.sampleRate} Hz, ${(ctx.baseLatency*1000).toFixed(1)} ms`, true);
    btn.textContent = "Running";
    initMidi();
  } catch (err) {
    setStatus("failed: " + err.message);
    btn.disabled = false;
    console.error(err);
  }
});
</script>
